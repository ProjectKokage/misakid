name: English eSpeak native adapter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-espeak-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-espeak:
    # This label intentionally selects an owner-provisioned machine. The job
    # never downloads or redistributes the GPL eSpeak runtime or data tree.
    runs-on: [self-hosted, macOS, ARM64, misakid-espeak-en]
    timeout-minutes: 20
    env:
      MISAKID_ESPEAK_EN_LIBRARY: ${{ vars.MISAKID_ESPEAK_EN_LIBRARY }}
      MISAKID_ESPEAK_EN_DATA: ${{ vars.MISAKID_ESPEAK_EN_DATA }}
      MISAKID_SPACY_EN_MODEL_DIR: ${{ vars.MISAKID_SPACY_EN_MODEL_DIR }}
      NATIVE_BUILD: ${{ runner.temp }}/misakid-espeak-en
      NATIVE_BUILD_2: ${{ runner.temp }}/misakid-espeak-en-reproducible
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - name: Validate explicit provisioned resource paths
        run: |
          test -n "$MISAKID_ESPEAK_EN_LIBRARY"
          test -f "$MISAKID_ESPEAK_EN_LIBRARY"
          test -n "$MISAKID_ESPEAK_EN_DATA"
          test -d "$MISAKID_ESPEAK_EN_DATA"
          test -n "$MISAKID_SPACY_EN_MODEL_DIR"
          test -d "$MISAKID_SPACY_EN_MODEL_DIR"
          test "$(stat -f%z "$MISAKID_SPACY_EN_MODEL_DIR/tokenizer")" = 77066
          test "$(stat -f%z "$MISAKID_SPACY_EN_MODEL_DIR/vocab/lookups.bin")" = 70040
          test "$(stat -f%z "$MISAKID_SPACY_EN_MODEL_DIR/tok2vec/model")" = 6269370
          test "$(stat -f%z "$MISAKID_SPACY_EN_MODEL_DIR/tagger/model")" = 19829
          test "$(shasum -a 256 "$MISAKID_SPACY_EN_MODEL_DIR/tokenizer" | awk '{print $1}')" = b014e8bba4958b120af2d0c1c63eabb7c00379f2bacaf10df7c5325efd2ea467
          test "$(shasum -a 256 "$MISAKID_SPACY_EN_MODEL_DIR/vocab/lookups.bin" | awk '{print $1}')" = fce9c883c56165f29573cc938c2a1c9d417ac61bd8f56b671dd5f7996de70682
          test "$(shasum -a 256 "$MISAKID_SPACY_EN_MODEL_DIR/tok2vec/model" | awk '{print $1}')" = e84fc06eb319c94d28e460fc334e292120b01f18baa5dc8b50c977459820a090
          test "$(shasum -a 256 "$MISAKID_SPACY_EN_MODEL_DIR/tagger/model" | awk '{print $1}')" = 1ec3d93f38cebe172f2b5c89d84be72856ce42c8f1a64f1699f1d98a771f36b7
      - run: dart pub get
      - name: Build the package-owned adapter dylib
        working-directory: packages/misakid_espeak_en
        run: >-
          dart run tool/build_native.dart
          --build-dir "$NATIVE_BUILD"
      - name: Rebuild independently for reproducibility
        working-directory: packages/misakid_espeak_en
        run: >-
          dart run tool/build_native.dart
          --build-dir "$NATIVE_BUILD_2"
      - name: Verify the installed native artifact
        working-directory: packages/misakid_espeak_en
        run: |
          LIB="$NATIVE_BUILD/install/lib/libmisakid_espeak_en.dylib"
          LIB2="$NATIVE_BUILD_2/install/lib/libmisakid_espeak_en.dylib"
          cmp "$LIB" "$LIB2"
          nm -gjU "$LIB" | LC_ALL=C sort > "$RUNNER_TEMP/misakid-espeak-en-exports.txt"
          diff -u native/expected_exports_macos.txt "$RUNNER_TEMP/misakid-espeak-en-exports.txt"
          test "$(otool -D "$LIB" | tail -n 1)" = '@rpath/libmisakid_espeak_en.dylib'
          test "$(otool -L "$LIB" | tail -n +2 | wc -l | tr -d ' ')" = 3
          otool -L "$LIB" | grep -F '/usr/lib/libSystem.B.dylib'
          otool -L "$LIB" | grep -F '/usr/lib/libc++.1.dylib'
          ! otool -L "$LIB" | grep -F 'libespeak-ng'
          otool -l "$LIB" | grep -F 'minos 11.0'
          ! nm -u "$LIB" | grep -E '(_exit|_abort)$'
          ! strings "$LIB" | grep -F "$NATIVE_BUILD"
          ! strings "$LIB" | grep -F "$NATIVE_BUILD_2"
          ! strings "$LIB" | grep -F "$GITHUB_WORKSPACE"
          ! strings "$LIB" | grep -F "$MISAKID_ESPEAK_EN_LIBRARY"
          ! strings "$LIB" | grep -F "$MISAKID_ESPEAK_EN_DATA"
          test -f "$NATIVE_BUILD/install/share/misakid_espeak_en/LICENSE"
          test -f "$NATIVE_BUILD/install/share/misakid_espeak_en/THIRD_PARTY_NOTICES.md"
          test -f "$NATIVE_BUILD/install/share/misakid_espeak_en/SOURCE_MANIFEST.md"
      - name: Run exact raw and composed English parity and safety tests
        working-directory: packages/misakid_espeak_en
        env:
          MISAKID_ESPEAK_EN_ADAPTER_LIBRARY: ${{ runner.temp }}/misakid-espeak-en/install/lib/libmisakid_espeak_en.dylib
        run: >-
          dart test
          test/native_parity_test.dart
          test/combined_parity_test.dart
