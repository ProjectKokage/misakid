name: Provisioned mobile runtime parity

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  japanese-cutlet:
    name: Japanese Cutlet on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-emulator
            os: ubuntu-24.04
          - target: ios-simulator
            os: macos-14
    defaults:
      run:
        working-directory: tool/mobile_integration
    env:
      FLUTTER_VERSION: 3.41.7
      ANDROID_NDK_VERSION: 28.2.13676358
      COCOAPODS_DISABLE_STATS: 'true'
      UNIDIC_ARCHIVE_URL: >-
        https://huggingface.co/drewThomasson/unidic_3.1.0_backup/resolve/9fcae6f3676c255dac3b81d8fbc83b16cc192d20/unidic-3.1.0.zip
      UNIDIC_ARCHIVE_SHA256: 39ea0eae3b1f10ba8986483592cbc83bcc92f1898bb43ecbc607010f2e98cd22
      UNIDIC_ARCHIVE_BYTES: '524664138'
      WORD_LIST_URL: >-
        https://raw.githubusercontent.com/hexgrad/misaki/fba1236595f2d2bf21d414ba6e57d25256afada3/misaki/data/ja_words.txt
      WORD_LIST_SHA256: a93a8e8aee24db307a32becb8bf01c4c2908ecf37e6c91f7a705fafdfeba67ff
      WORD_LIST_BYTES: '1921140'
      FIXTURE_SHA256: c599ac58455263a9c9e100f175e9eaa07d1b9e77194a075dea6d02d3a1627a48
      FIXTURE_BYTES: '47945'
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java
        if: matrix.target == 'android-emulator'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Report toolchain
        run: flutter --version
      - name: Resolve harness dependencies
        run: flutter pub get
      - name: Download and verify external parity resources
        shell: bash
        run: |
          set -euo pipefail
          resource_root="$RUNNER_TEMP/misakid-mobile-resources"
          archive="$resource_root/unidic-3.1.0.zip"
          dictionary="$resource_root/unidic-cwj"
          word_list="$resource_root/ja_words.txt"
          fixture="$GITHUB_WORKSPACE/test/fixtures/upstream/fba1236595f2d2bf21d414ba6e57d25256afada3/ja_cutlet.jsonl"
          mkdir -p "$resource_root" "$dictionary"
          curl --fail --location --retry 3 --output "$archive" "$UNIDIC_ARCHIVE_URL"
          test "$(wc -c < "$archive" | tr -d '[:space:]')" = "$UNIDIC_ARCHIVE_BYTES"
          printf '%s  %s\n' "$UNIDIC_ARCHIVE_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$dictionary"
          curl --fail --location --retry 3 --output "$word_list" "$WORD_LIST_URL"
          test "$(wc -c < "$word_list" | tr -d '[:space:]')" = "$WORD_LIST_BYTES"
          printf '%s  %s\n' "$WORD_LIST_SHA256" "$word_list" | shasum -a 256 --check
          test "$(wc -c < "$fixture" | tr -d '[:space:]')" = "$FIXTURE_BYTES"
          printf '%s  %s\n' "$FIXTURE_SHA256" "$fixture" | shasum -a 256 --check
          echo "RESOURCE_DICTIONARY=$dictionary" >> "$GITHUB_ENV"
          echo "RESOURCE_WORD_LIST=$word_list" >> "$GITHUB_ENV"
          echo "RESOURCE_FIXTURE=$fixture" >> "$GITHUB_ENV"
      - name: Start authenticated loopback resource server
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          ready_file="$RUNNER_TEMP/misakid-mobile-resource-server.json"
          log_file="$RUNNER_TEMP/misakid-mobile-resource-server.log"
          python3 tool/serve_mobile_resources.py \
            --dictionary "$RESOURCE_DICTIONARY" \
            --word-list "$RESOURCE_WORD_LIST" \
            --fixture "$RESOURCE_FIXTURE" \
            --token "$token" \
            --ready-file "$ready_file" \
            > "$log_file" 2>&1 &
          server_pid=$!
          for _ in {1..300}; do
            if test -s "$ready_file"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 2
          done
          test -s "$ready_file"
          port="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["port"])' "$ready_file")"
          echo "::add-mask::$token"
          echo "RESOURCE_SERVER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "RESOURCE_SERVER_PORT=$port" >> "$GITHUB_ENV"
          echo "RESOURCE_SERVER_PID=$server_pid" >> "$GITHUB_ENV"
          echo "RESOURCE_SERVER_LOG=$log_file" >> "$GITHUB_ENV"
      - name: Install pinned Android NDK
        if: matrix.target == 'android-emulator'
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "ndk;${ANDROID_NDK_VERSION}"
      - name: Run parity on Android emulator
        if: matrix.target == 'android-emulator'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            cd tool/mobile_integration
            flutter test integration_test/japanese_mobile_parity_test.dart \
            -d emulator-5554 \
            --dart-define=MISAKID_TEST_RESOURCE_BASE_URL=http://10.0.2.2:$RESOURCE_SERVER_PORT \
            --dart-define=MISAKID_TEST_RESOURCE_TOKEN=$RESOURCE_SERVER_TOKEN
      - name: Select and boot iOS simulator
        if: matrix.target == 'ios-simulator'
        shell: bash
        run: |
          set -euo pipefail
          devices="$RUNNER_TEMP/available-ios-devices.json"
          xcrun simctl list devices available -j > "$devices"
          device_id="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); candidates=[device for runtime in sorted(data["devices"], reverse=True) for device in data["devices"][runtime] if device.get("isAvailable", True) and device["name"].startswith("iPhone")]; print(candidates[0]["udid"] if candidates else "")' "$devices")"
          test -n "$device_id"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          echo "IOS_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      - name: Run parity on iOS simulator
        if: matrix.target == 'ios-simulator'
        run: >-
          flutter test integration_test/japanese_mobile_parity_test.dart
          -d "$IOS_SIMULATOR_ID"
          --dart-define=MISAKID_TEST_RESOURCE_BASE_URL=http://localhost:${RESOURCE_SERVER_PORT}
          --dart-define=MISAKID_TEST_RESOURCE_TOKEN=${RESOURCE_SERVER_TOKEN}
      - name: Stop resource server
        if: always() && env.RESOURCE_SERVER_PID != ''
        shell: bash
        run: |
          kill "$RESOURCE_SERVER_PID" 2>/dev/null || true
          wait "$RESOURCE_SERVER_PID" 2>/dev/null || true
      - name: Upload resource-server log on failure
        if: failure() && env.RESOURCE_SERVER_LOG != ''
        uses: actions/upload-artifact@v4
        with:
          name: resource-server-${{ matrix.target }}
          path: ${{ env.RESOURCE_SERVER_LOG }}
          if-no-files-found: ignore
