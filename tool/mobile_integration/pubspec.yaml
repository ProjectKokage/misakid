name: misakid_mobile_integration
description: Mobile build harness for the bundled Japanese native-code assets.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  misakid:
    path: ../..
  misakid_mecab_ja:
    path: ../../packages/misakid_mecab_ja
  misakid_openjtalk:
    path: ../../packages/misakid_openjtalk

dependency_overrides:
  # Keep the adapters' publishable hosted constraints on this repository copy.
  misakid:
    path: ../..
  misakid_adapter_support:
    path: ../../packages/misakid_adapter_support

dev_dependencies:
  crypto: ^3.0.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
