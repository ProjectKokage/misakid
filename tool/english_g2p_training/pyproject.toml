[project]
name = "misakid-english-g2p-training"
version = "0.1.0"
description = "Deterministic en-US CTC G2P training and ONNX export for Misakid"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "onnx==1.18.0",
  "onnxruntime==1.22.1",
  "torch==2.7.1",
]

[project.scripts]
misakid-train-english-g2p = "misakid_g2p_training.cli:main"

[dependency-groups]
dev = [
  "pyright==1.1.403",
  "pytest==8.4.1",
  "ruff==0.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misakid_g2p_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
